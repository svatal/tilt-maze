name: GitHub Pages (gh-pages)

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

concurrency:
  group: gh-pages-linear
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-test:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    env:
      # Kořen produkce: /tilt-maze/ · Náhled PR: /tilt-maze/pr-N/
      VITE_BASE_PATH: ${{ github.event_name == 'pull_request' && format('/tilt-maze/pr-{0}/', github.event.pull_request.number) || '/tilt-maze/' }}
      E2E_BASE_PATH: ${{ github.event_name == 'pull_request' && format('/tilt-maze/pr-{0}/', github.event.pull_request.number) || '/tilt-maze/' }}
      PR_NUMBER: ${{ github.event.pull_request.number || '' }}
      # Štítek v aplikaci: u PR head commit větve (ne ephemeral merge SHA z GITHUB_SHA).
      BUILD_INFO_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      VITE_IS_PR_PREVIEW: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
      VITE_DISABLE_PWA: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalace, testy a sestavení
        run: |
          npm ci
          npm run test:unit
          npm run build
          npx playwright install chromium
          npm run test:e2e

      - name: Nahraj dist
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.run_id }}
          path: dist
          retention-days: 1

  deploy:
    name: Deploy to gh-pages
    needs: [build-test]
    if: >
      always() && needs.build-test.result == 'success' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'pull_request' &&
         contains(fromJSON('["opened", "synchronize", "reopened"]'), github.event.action) &&
         github.event.pull_request.head.repo.full_name == github.repository)
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.run_id }}
          path: dist

      - name: Nasazení (main → kořen gh-pages)
        if: github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          keep_files: true

      - name: Nasazení (PR → pr-N)
        if: github.event_name == 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          # Kořen gh-pages = stránky projektu /tilt-maze/ — náhled je /tilt-maze/pr-N/
          destination_dir: pr-${{ github.event.pull_request.number }}
          keep_files: true

      - name: Komentář s náhledem PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const url = `https://${owner}.github.io/${repo}/tilt-maze/pr-${pr}/`;
            const marker = '<!-- pr-preview-bot -->';
            const body = `${marker}
            ### Náhled nasazení (PR #${pr})

            Otevřít na telefonu (HTTPS kvůli senzorům): **${url}**

            Po zavření nebo sloučení PR se složka \`pr-${pr}\` z \`gh-pages\` smaže. Produkce zůstává na \`https://${owner}.github.io/${repo}/tilt-maze/\`.`;

            try {
              const { data: comments } = await github.rest.issues.listComments({
                owner,
                repo,
                issue_number: pr,
                per_page: 100
              });
              const existing = comments.find(c => c.body && c.body.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                  body
                });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number: pr, body });
              }
            } catch (err) {
              core.warning(
                `Nasazení náhledu proběhlo, ale komentář na PR #${pr} se nepodařilo zapsat: ${err.message}`
              );
            }

  pr-cleanup:
    name: Smazat náhled PR z gh-pages
    if: >
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Odstranit pr-${{ github.event.pull_request.number }}
        env:
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d "pr-${PR_NUM}" ]; then
            git rm -rf "pr-${PR_NUM}"
            git commit -m "chore(pages): remove pr-${PR_NUM} preview"
            git push origin gh-pages
          else
            echo "Složka pr-${PR_NUM} neexistuje, přeskočeno."
          fi

      - name: Komentář – náhled odstraněn
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const marker = '<!-- pr-preview-bot -->';
            const body = `${marker}
            ### Náhled PR #${pr}

            Složka \`pr-${pr}\` byla po zavření PR odstraněna z větve \`gh-pages\`.`;

            try {
              const { data: comments } = await github.rest.issues.listComments({
                owner, repo, issue_number: pr, per_page: 100
              });
              const existing = comments.find(c => c.body && c.body.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({
                  owner, repo, comment_id: existing.id, body
                });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number: pr, body });
              }
            } catch (err) {
              core.warning(
                `Složka pr-${pr} byla z gh-pages odstraněna (nebo už neexistovala), ale komentář na PR se nepodařilo aktualizovat: ${err.message}`
              );
            }
